services:
  backend_project:
    container_name: 'backend_project'
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9289:8080"
    depends_on: 
      - postgres
    entrypoint: >
      bash -c "until nc -z postgres 5432; do sleep 1; done && ./run.sh"
    networks:
      - default

  postgres:
    container_name: 'postgres'
    image: postgres:15.3
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: developer
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: backend_project
    ports:
      - "6289:5432"
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d backend_project -U developer"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  default:
    driver: bridge
